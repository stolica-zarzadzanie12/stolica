<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strona nie znaleziona | Stolica - Zarządzanie Nieruchomościami</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 3rem;
      color: #DAA520;
      margin-bottom: 1rem;
    }
    p {
      color: #666;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #DAA520;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background: #FFD700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Przepraszamy, ale strona której szukasz nie istnieje.</p>
    <a href="/" class="btn">Wróć do strony głównej</a>
  </div>
</body>
</html>
